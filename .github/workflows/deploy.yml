
name: Deploy to Velixir

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"

      - name: Deploy DARB server
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_API_KEY }}
        run: |
          if [ -z "$VELIXIR_API_KEY" ]; then
            echo "Missing VELIXIR_API_KEY secret"
            exit 1
          fi
          velixir deploy --app 468d8a20-2b7f-4a23-a3bc-bd1ca9598a0d

